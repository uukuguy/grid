[project]
name = "eaasp-l5-cowork"
version = "0.1.0"
description = "EAASP v2.0 L5 Cowork UI substrate — four-card projection (Event/Evidence/Action/Approval) + retrospective cycle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
eaasp-l5-cowork = "eaasp_l5_cowork.cli:main"
eaasp-l5-cowork-serve = "eaasp_l5_cowork.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaasp_l5_cowork"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
